<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Session — SeminarSmack</title>
    <meta name="description" content="Join a live classroom session. Answer polls, quizzes, and questions from your phone." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="./assets/img/logo.png" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script>window.APP_CONFIG = window.APP_CONFIG || {};</script>
    <script src="./js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body data-page="join" class="participant-view">
    <div class="app-shell participant-shell">
      <header class="app-topbar"><a class="brand" href="./index.html"><img src="./assets/img/logo.png" alt="" /><span>SeminarSmack</span></a><span class="live-dot">Participant</span></header>
      <main class="participant-main">
        <div id="page-status" class="status-banner" aria-live="polite"></div>
        <section id="session-summary" class="participant-session-card"></section>
        <nav class="participant-tabs" aria-label="Participant views">
          <button class="participant-tab is-active" type="button" data-participant-tab="answer">Answer</button>
          <button class="participant-tab" type="button" data-participant-tab="results">Results</button>
          <button class="participant-tab" type="button" data-participant-tab="questions">Ask a question</button>
        </nav>
        <section id="activity-stage" class="participant-card"></section>
        <section id="results-stage" class="participant-card"></section>
        <section id="questions-stage" class="participant-card"></section>
      </main>
    </div>
  </body>
</html>
