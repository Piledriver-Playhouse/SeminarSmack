<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host Session — SeminarSmack</title>
    <meta name="description" content="Host a live classroom session. Control activities, see live responses, and share the QR code with your students." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./assets/img/logo.png" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script>
      window.APP_CONFIG = window.APP_CONFIG || {};
    </script>
    <script src="./js/config.js"></script>
    <!-- QR code library vendored locally — no CDN dependency -->
    <script src="./js/vendor/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body data-page="present" class="presenter-focus">
    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="./index.html"><img src="./assets/img/logo.png" alt="" /><span>SeminarSmack</span></a>
        <div class="topbar-actions"><span class="live-dot">Presenter</span><a class="button button-ghost button-small" href="./index.html">Exit</a></div>
      </header>

      <main class="presenter-main">
        <div id="page-status" class="status-banner" aria-live="polite"></div>

        <section id="session-summary" class="session-summary-card"></section>

      <nav class="presenter-tabs" aria-label="Presenter views">
        <button class="presenter-tab is-active" type="button" data-presenter-tab="overview">Run session</button>
        <button class="presenter-tab" type="button" data-presenter-tab="join">Join details</button>
        <button class="presenter-tab" type="button" data-presenter-tab="questions">Questions</button>
        <button class="presenter-tab" type="button" data-presenter-tab="session">Session setup</button>
      </nav>

      <div class="dashboard-grid">
        <section id="qr-panel" class="panel panel-spacious"></section>
        <section id="control-panel" class="panel panel-spacious"></section>
        <section id="activity-stage" class="panel panel-spacious"></section>
        <section id="results-stage" class="panel panel-spacious"></section>
        <section id="questions-panel" class="panel panel-spacious"></section>
        <section id="authoring-panel" class="panel panel-spacious"></section>
      </div>
      </main>
    </div>
  </body>
</html>
